<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Genesis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #020208;
            color: #e0e8ff;
            overflow: visible;
            min-height: 100vh;
            user-select: none;
        }
        
        /* Canvas created by visual.js */
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(180deg, rgba(10,20,50,0.95) 0%, rgba(10,20,50,0.6) 50%, rgba(10,20,50,0));
            z-index: 100;
            border-bottom: 1px solid rgba(0,150,255,0.15);
            backdrop-filter: blur(3px);
        }
        
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #00ccff;
            text-shadow: 0 0 20px #00ccff55;
            letter-spacing: 3px;
        }
        
        .header-btns { display: flex; gap: 0.5rem; }
        
        .btn {
            background: rgba(0,200,255,0.1);
            border: 1px solid #00ccff44;
            color: #00ccff;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: rgba(0,200,255,0.2);
            box-shadow: 0 0 10px #00ccff33;
        }
        
        .menu {
            position: fixed;
            top: 4rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            z-index: 100;
            padding: 0.8rem;
            background: rgba(10,20,40,0.7);
            border-radius: 8px;
            border: 1px solid rgba(60,80,150,0.3);
            backdrop-filter: blur(5px);
        }
        
        .menu-btn {
            background: rgba(20,25,60,0.85);
            border: 1px solid #4466ff33;
            color: #aabbdd;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            text-align: left;
            transition: all 0.2s;
            border-radius: 4px;
        }
        
        .menu-btn:hover, .menu-btn.active {
            background: rgba(60,80,180,0.5);
            border-color: #6688ff;
            color: #ccddff;
        }
        
        .menu-btn .key {
            display: inline-block;
            background: #334466;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-size: 0.75rem;
            margin-right: 0.4rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .stats { display: flex; gap: 1.5rem; margin: 1rem 0; flex-wrap: wrap; justify-content: center; }
        
        .stat { text-align: center; }
        .stat .lbl { display: block; font-size: 0.7rem; color: #6688aa; letter-spacing: 1px; }
        .stat .val { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #aaccff; }
        .stat.crit .val { color: #ffaa00; }
        
        .energy-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00ddff;
            text-shadow: 0 0 20px #00ddff66;
            margin: 0.5rem 0;
        }
        
        .orb {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4a6a8a, #2a426a, #111122);
            cursor: pointer;
            box-shadow: 
                0 0 30px rgba(0, 150, 255, 0.3),
                0 0 60px rgba(0, 150, 255, 0.15),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            position: relative;
            overflow: visible;
        }
        
        .orb::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,255,0.2) 0%, transparent 70%);
            animation: orbPulse 2s ease-in-out infinite;
            z-index: -1;
        }
        
        .orb::after {
            content: '';
            position: absolute;
            inset: -25px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100,150,255,0.1) 0%, transparent 60%);
            animation: orbRing 3s ease-in-out infinite;
            z-index: -2;
        }
        
        @keyframes orbPulse {
            0%,100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        
        @keyframes orbRing {
            0%,100% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .planet-click-area {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            background: transparent;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(0,200,255,0.15);
        }
        
        .planet-click-area::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,255,0.1) 0%, transparent 70%);
            animation: clickPulse 2s ease-in-out infinite;
        }
        
        @keyframes clickPulse {
            0%,100% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        
        .planet-click-area:active {
            transform: translate(-50%, -50%) scale(0.96);
            box-shadow: 0 0 60px rgba(0,200,255,0.3);
        }
        
        .orb:active { transform: scale(0.95); }

        .orb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100vh;
            background: rgba(8,12,30,0.98);
            border-left: 1px solid rgba(60,90,180,0.4);
            z-index: 200;
            transition: right 0.3s;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
        }
        
        .panel.active { right: 0; }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #334466;
            background: rgba(20,30,60,0.5);
        }
        
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            color: #6688ff;
        }
        
        .panel-close {
            background: none;
            border: none;
            color: #8899aa;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .panel-content { padding: 1rem; max-height: calc(100vh - 120px); overflow-y: auto; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .toast-msg {
            background: rgba(20,30,60,0.95);
            border: 1px solid #4466ff;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            animation: toastIn 0.3s ease-out;
        }
        
        .toast-msg.error { border-color: #ff4444; color: #ff6666; }
        .toast-msg.success { border-color: #44ff88; color: #66ffaa; }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .boss-arena {
            position: fixed;
            inset: 0;
            background: rgba(5,5,15,0.97);
            z-index: 400;
            display: none;
        }
        
        .boss-arena.active { display: block; }
        
        #bossCanvas { width: 100%; height: 100%; }
        
        .boss-hud {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
        }
        
        .boss-hp-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 20px;
            background: #222;
            border: 2px solid #ff3300;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .boss-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3300, #ff6600);
            transition: width 0.3s;
        }
        
        .boss-quit {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #ff3333;
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
        
        .ability-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(10,15,30,0.95);
            border-top: 1px solid #334466;
            z-index: 100;
        }
        
        .ability-btn {
            width: 50px;
            height: 50px;
            background: rgba(30,40,80,0.8);
            border: 2px solid #4455aa;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        
        .ability-btn:hover { border-color: #6688ff; }
        .ability-btn.locked { opacity: 0.4; }
        .ability-btn.cooldown { opacity: 0.5; }
        
        .ability-btn .key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.6rem;
            color: #88aacc;
        }
        
        .ability-btn .cd-timer {
            position: absolute;
            bottom: 2px;
            font-size: 0.7rem;
            color: #ffaa00;
        }
        
        .ability-btn .icon { font-size: 1.2rem; }
        
        .shop-tabs {
            display: flex;
            gap: 0.3rem;
            padding: 0.5rem;
            background: #1a1a2e;
            border-bottom: 1px solid #334466;
            flex-wrap: wrap;
        }
        
        .shop-tab {
            flex: 1;
            min-width: 60px;
            padding: 0.4rem;
            background: #223344;
            border: 1px solid #334455;
            color: #88aacc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        
        .shop-tab.active {
            background: #334466;
            border-color: #4466aa;
            color: #aaccff;
        }
    </style>
</head>
<body>
    <!-- Canvas created by visual.js -->
    <canvas id="bgCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>
    
    <div class="header">
        <div class="title">QUANTUM GENESIS</div>
        <div class="header-btns">
            <button class="btn" onclick="toggleSound()">🔊</button>
            <button class="btn" onclick="toggleFullscreen()">[ ]</button>
            <button class="btn" onclick="saveGame()">SAVE</button>
            <button class="btn" onclick="resetGame()">RESET</button>
        </div>
    </div>
    
    <div class="menu">
        <button class="menu-btn" onclick="openShop()"><span class="key">U</span> SHOP</button>
        <button class="menu-btn" onclick="openRelics()"><span class="key">R</span> RELICS</button>
        <button class="menu-btn" onclick="openPanel('zones')"><span class="key">Z</span> ZONES</button>
        <button class="menu-btn" onclick="openPanel('stats')"><span class="key">S</span> STATS</button>
        <button class="menu-btn" onclick="openPanel('prestige')"><span class="key">P</span> PRESTIGE</button>
        <button class="menu-btn" onclick="openPanel('achievements')"><span class="key">M</span> ACHIEVEMENTS</button>
        <button class="menu-btn" onclick="startBoss()"><span class="key">B</span> BOSS</button>
    </div>
    
    <style id="dynamicStyles">
        /* Base styles - will evolve with upgrades */
    </style>
    
    <div class="game-container">
        <div class="orb-wrapper">
            <!-- Clickable EPIC planet overlay -->
            <div class="planet-click-area" onclick="handleClick()"></div>
            
            <div class="energy-display" id="energyDisplay">0</div>
            
            <div class="stats">
                <div class="stat"><span class="lbl">COMBO</span><span class="val" id="comboVal">x1.0</span></div>
                <div class="stat"><span class="lbl">CPS</span><span class="val" id="cpsVal">0</span></div>
                <div class="stat crit"><span class="lbl">CRIT</span><span class="val" id="critVal">0%</span></div>
                <div class="stat"><span class="lbl">ZONE</span><span class="val" id="zoneVal">x1.0</span></div>
                <div class="stat" style="color:#ffaa00;"><span class="lbl" style="color:#aa8844;">AC</span><span class="val" id="acVal">0</span></div>
                <div class="stat"><span class="lbl">RELICS</span><span class="val" id="relicsVal">0</span></div>
            </div>
        </div>
    </div>
    
    <div class="panel" id="panel-shop">
        <div class="panel-header">
            <div class="panel-title">BOOSTS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="shop-tabs" id="shopTabs">
            <button class="shop-tab active" onclick="switchShopTab('click', event)">Click</button>
            <button class="shop-tab" onclick="switchShopTab('gen', event)">Gen</button>
            <button class="shop-tab" onclick="switchShopTab('combat', event)">Combat</button>
            <button class="shop-tab" onclick="switchShopTab('special', event)">Special</button>
            <button class="shop-tab" onclick="switchShopTab('abilities', event)">Abilities</button>
            <button class="shop-tab" onclick="switchShopTab('relics', event)">Relics</button>
        </div>
        <div class="panel-content" id="shopContent"></div>
    </div>
    
    <div class="panel" id="panel-stats">
        <div class="panel-header">
            <div class="panel-title">STATISTICS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="statsContent"></div>
    </div>
    
    <div class="panel" id="panel-prestige">
        <div class="panel-header">
            <div class="panel-title">PRESTIGE</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="prestigeContent"></div>
    </div>
    
    <div class="panel" id="panel-achievements">
        <div class="panel-header">
            <div class="panel-title">ACHIEVEMENTS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="achievementsContent"></div>
    </div>
    
    <div class="panel" id="panel-relics">
        <div class="panel-header">
            <div class="panel-title">RELICS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="relicsContent"></div>
    </div>
    
    <div class="panel" id="panel-zones">
        <div class="panel-header">
            <div class="panel-title">ZONES</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="zonesContent"></div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <div class="boss-arena" id="bossArena">
        <canvas id="bossCanvas"></canvas>
        <div class="boss-hud">
            <div id="bossName">BOSS</div>
            <div>HP: <span id="bossPlayerHp">3</span></div>
            <div id="bossTimer">60s</div>
        </div>
        <div class="boss-hp-bar"><div class="boss-hp-fill" id="bossHpFill"></div></div>
        <button class="boss-quit" onclick="quitBoss()">QUIT</button>
    </div>
    
    <div class="ability-bar" id="abilityBar"></div>
    
    <!-- Load all modules -->
    <!-- Constants and Helpers first -->
    <script src="constants.js"></script>
    <script src="helpers.js"></script>
    
    <!-- Core Systems -->
    <script src="boss-projectile.js"></script>
    <script src="boss-attacks.js"></script>
    <script src="boss-movement.js"></script>
    <script src="boss-particles.js"></script>
    <script src="boss-effects.js"></script>
    <script src="boss-audio.js"></script>
    <script src="boss-base.js"></script>
    
    <!-- Boss Definitions -->
    <script src="boss-void-assassin.js"></script>
    <script src="boss-virus-queen.js"></script>
    <script src="boss-thunder-emperor.js"></script>
    <script src="boss-tempest-lord.js"></script>
    <script src="boss-nexus-core.js"></script>
    <script src="boss-magma-sovereign.js"></script>
    <script src="boss-phoenix.js"></script>
    <script src="boss-ice-tyrant.js"></script>
    <script src="boss-eternal-guardian.js"></script>
    <script src="boss-eternal-dragon.js"></script>
    <script src="boss-blade-master.js"></script>
    <script src="boss-chronomancer.js"></script>
    
    <script src="audio.js"></script>
    <script src="ui.js"></script>
    <script src="save.js"></script>
    <script src="boss.js"></script>
    <script src="game.js"></script>
    <script src="visual.js"></script>
    
    <script>
        function initGame() {
            if (!window.GAME || !window.UPGRADES) {
                setTimeout(initGame, 50);
                return;
            }
            
            // Initialize Visual System
            if (typeof initVisuals === 'function') {
                initVisuals();
            }
            
            // Load game
            loadGame();
            applySettings();
            calculateRelicBonuses();
            updateDisplay();
            renderAbilityBar();
            
            // CPS tick
            setInterval(() => {
                var cps = getCps();
                if (cps > 0 && window.GAME && !window.bossActive) {
                    window.GAME.energy += cps / 10;
                    window.GAME.lifetimeEnergy += cps / 10;
                    updateDisplay();
                }
            }, 100);
            
            // Combo decay - rate controlled by relic bonus
            setInterval(() => {
                if (window.clickCombo > 1) {
                    const decayRate = 0.02 * (1 - (relicBonuses.comboDecay || 0));
                    window.clickCombo = Math.max(1, window.clickCombo - decayRate);
                    window.GAME.combo = window.clickCombo;
                }
            }, 100);
            
            // Auto save
            setInterval(() => saveGame(false), 30000);
            
            // UI Evolution update
            setInterval(() => {
                try {
                    var up = (typeof getUpgradeCounts === 'function') ? getUpgradeCounts() : {total:0, click:0, gen:0, special:0};
                    var totalL = up.total || 0;
                    var clickL = up.click || 0;
                    var genL = up.gen || 0;
                    var specialL = up.special || 0;
                    
                    var styleEl = document.getElementById('dynamicStyles');
                    if (!styleEl) return;
                    
                    var css = '';
                    
                    // Button evolution
                    if (totalL > 5) {
                        css += '.btn, .menu-btn, .shop-tab { border-radius: 6px; transition: all 0.3s; } ';
                    }
                    if (totalL > 15) {
                        css += '.btn, .menu-btn { box-shadow: 0 0 10px rgba(0,200,255,0.3); } ';
                    }
                    if (totalL > 30) {
                        css += '.btn, .menu-btn, .shop-tab { border-color: #00ccff88; background: rgba(0,40,80,0.8); } ';
                    }
                    if (totalL > 50) {
                        css += '.btn, .menu-btn { background: linear-gradient(135deg, rgba(0,60,120,0.9), rgba(0,30,80,0.9)); box-shadow: 0 0 15px rgba(0,200,255,0.4), inset 0 1px 0 rgba(255,255,255,0.1); } ';
                    }
                    if (specialL > 3) {
                        css += '.btn, .menu-btn, .shop-tab { animation: uiPulse 2s ease-in-out infinite; } @keyframes uiPulse { 0%,100% { box-shadow: 0 0 10px rgba(255,100,255,0.3); } 50% { box-shadow: 0 0 20px rgba(255,100,255,0.6); } } ';
                    }
                    
                    // Energy display glow
                    if (genL > 5) {
                        css += '.energy-display { text-shadow: 0 0 20px #00ddff66, 0 0 40px #00ddff33; } ';
                    }
                    if (genL > 20) {
                        css += '.energy-display { text-shadow: 0 0 25px #00ff88aa, 0 0 50px #00ff8844; } ';
                    }
                    
                    // Panel evolution
                    if (totalL > 20) {
                        css += '.panel { background: linear-gradient(180deg, rgba(10,20,50,0.98), rgba(5,10,30,0.98)); } ';
                    }
                    if (totalL > 40) {
                        css += '.panel { border-left: 1px solid rgba(100,150,255,0.5); box-shadow: -5px 0 30px rgba(0,100,200,0.2); } ';
                    }
                    if (specialL > 2) {
                        css += '.panel { animation: panelGlow 3s ease-in-out infinite; } @keyframes panelGlow { 0%,100% { box-shadow: -5px 0 30px rgba(0,100,200,0.2); } 50% { box-shadow: -5px 0 30px rgba(150,50,255,0.3); } } ';
                    }
                    
                    // Stats evolution
                    if (clickL > 10) {
                        css += '.stat .val { text-shadow: 0 0 5px currentColor; } ';
                    }
                    
                    styleEl.textContent = css;
                } catch(e) {}
            }, 500);
        }
        
        initGame();
    </script>
</body>
</html>
