<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Genesis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #020208;
            color: #e0e8ff;
            overflow: visible;
            min-height: 100vh;
            user-select: none;
        }
        
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            cursor: pointer;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(180deg, rgba(10,15,40,0.95), rgba(10,15,40,0));
            z-index: 100;
        }
        
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #00ccff;
            text-shadow: 0 0 20px #00ccff55;
            letter-spacing: 3px;
        }
        
        .header-btns { display: flex; gap: 0.5rem; }
        
        .btn {
            background: rgba(0,200,255,0.1);
            border: 1px solid #00ccff44;
            color: #00ccff;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: rgba(0,200,255,0.2);
            box-shadow: 0 0 10px #00ccff33;
        }
        
        .menu {
            position: fixed;
            top: 4rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            z-index: 100;
        }
        
        .menu-btn {
            background: rgba(20,25,60,0.85);
            border: 1px solid #4466ff33;
            color: #aabbdd;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            text-align: left;
            transition: all 0.2s;
            border-radius: 4px;
        }
        
        .menu-btn:hover, .menu-btn.active {
            background: rgba(60,80,180,0.5);
            border-color: #6688ff;
            color: #ccddff;
        }
        
        .menu-btn .key {
            display: inline-block;
            background: #334466;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-size: 0.75rem;
            margin-right: 0.4rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .stats { display: flex; gap: 1.5rem; margin: 1rem 0; flex-wrap: wrap; justify-content: center; }
        
        .stat { text-align: center; }
        .stat .lbl { display: block; font-size: 0.7rem; color: #6688aa; letter-spacing: 1px; }
        .stat .val { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #aaccff; }
        .stat.crit .val { color: #ffaa00; }
        
        .energy-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00ddff;
            text-shadow: 0 0 20px #00ddff66;
            margin: 0.5rem 0;
        }
        
        .orb {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4a6a8a, #2a426a, #111122);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }
        
        .planet-click-area {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            background: transparent;
            transition: transform 0.1s;
        }
        
        .planet-click-area:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        .orb:active { transform: scale(0.95); }

        .orb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100vh;
            background: rgba(10,15,35,0.98);
            border-left: 1px solid #334466;
            z-index: 200;
            transition: right 0.3s;
            overflow-y: auto;
        }
        
        .panel.active { right: 0; }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #334466;
            background: rgba(20,30,60,0.5);
        }
        
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            color: #6688ff;
        }
        
        .panel-close {
            background: none;
            border: none;
            color: #8899aa;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .panel-content { padding: 1rem; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .toast-msg {
            background: rgba(20,30,60,0.95);
            border: 1px solid #4466ff;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            animation: toastIn 0.3s ease-out;
        }
        
        .toast-msg.error { border-color: #ff4444; color: #ff6666; }
        .toast-msg.success { border-color: #44ff88; color: #66ffaa; }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .boss-arena {
            position: fixed;
            inset: 0;
            background: rgba(5,5,15,0.97);
            z-index: 400;
            display: none;
        }
        
        .boss-arena.active { display: block; }
        
        #bossCanvas { width: 100%; height: 100%; }
        
        .boss-hud {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
        }
        
        .boss-hp-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 20px;
            background: #222;
            border: 2px solid #ff3300;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .boss-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3300, #ff6600);
            transition: width 0.3s;
        }
        
        .boss-quit {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #ff3333;
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
        
        .ability-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(10,15,30,0.95);
            border-top: 1px solid #334466;
            z-index: 100;
        }
        
        .ability-btn {
            width: 50px;
            height: 50px;
            background: rgba(30,40,80,0.8);
            border: 2px solid #4455aa;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        
        .ability-btn:hover { border-color: #6688ff; }
        .ability-btn.locked { opacity: 0.4; }
        .ability-btn.cooldown { opacity: 0.5; }
        
        .ability-btn .key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.6rem;
            color: #88aacc;
        }
        
        .ability-btn .cd-timer {
            position: absolute;
            bottom: 2px;
            font-size: 0.7rem;
            color: #ffaa00;
        }
        
        .ability-btn .icon { font-size: 1.2rem; }
        
        .shop-tabs {
            display: flex;
            gap: 0.3rem;
            padding: 0.5rem;
            background: #1a1a2e;
            border-bottom: 1px solid #334466;
            flex-wrap: wrap;
        }
        
        .shop-tab {
            flex: 1;
            min-width: 60px;
            padding: 0.4rem;
            background: #223344;
            border: 1px solid #334455;
            color: #88aacc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        
        .shop-tab.active {
            background: #334466;
            border-color: #4466aa;
            color: #aaccff;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    
    <div class="header">
        <div class="title">QUANTUM GENESIS</div>
        <div class="header-btns">
            <button class="btn" onclick="toggleSound()">🔊</button>
            <button class="btn" onclick="toggleFullscreen()">[ ]</button>
            <button class="btn" onclick="saveGame()">SAVE</button>
            <button class="btn" onclick="resetGame()">RESET</button>
        </div>
    </div>
    
    <div class="menu">
        <button class="menu-btn" onclick="openShop()"><span class="key">U</span> SHOP</button>
        <button class="menu-btn" onclick="openRelics()"><span class="key">R</span> RELICS</button>
        <button class="menu-btn" onclick="openPanel('zones')"><span class="key">Z</span> ZONES</button>
        <button class="menu-btn" onclick="openPanel('stats')"><span class="key">S</span> STATS</button>
        <button class="menu-btn" onclick="openPanel('prestige')"><span class="key">P</span> PRESTIGE</button>
        <button class="menu-btn" onclick="openPanel('achievements')"><span class="key">M</span> ACHIEVEMENTS</button>
        <button class="menu-btn" onclick="startBoss()"><span class="key">B</span> BOSS</button>
    </div>
    
    <div class="game-container">
        <div class="orb-wrapper">
            <!-- Clickable EPIC planet overlay -->
            <div class="planet-click-area" onclick="handleClick()"></div>
            
            <div class="energy-display" id="energyDisplay">0</div>
            
            <div class="stats">
                <div class="stat"><span class="lbl">COMBO</span><span class="val" id="comboVal">x1.0</span></div>
                <div class="stat"><span class="lbl">CPS</span><span class="val" id="cpsVal">0</span></div>
                <div class="stat crit"><span class="lbl">CRIT</span><span class="val" id="critVal">0%</span></div>
                <div class="stat"><span class="lbl">ZONE</span><span class="val" id="zoneVal">x1.0</span></div>
                <div class="stat" style="color:#ffaa00;"><span class="lbl" style="color:#aa8844;">AC</span><span class="val" id="acVal">0</span></div>
                <div class="stat"><span class="lbl">RELICS</span><span class="val" id="relicsVal">0</span></div>
            </div>
        </div>
    </div>
    
    <div class="panel" id="panel-shop">
        <div class="panel-header">
            <div class="panel-title">SHOP</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="shop-tabs" id="shopTabs">
            <button class="shop-tab active" onclick="switchShopTab('click')">Click</button>
            <button class="shop-tab" onclick="switchShopTab('gen')">Gen</button>
            <button class="shop-tab" onclick="switchShopTab('combat')">Combat</button>
            <button class="shop-tab" onclick="switchShopTab('special')">Special</button>
            <button class="shop-tab" onclick="switchShopTab('abilities')">Abilities</button>
        </div>
        <div class="panel-content" id="shopContent"></div>
    </div>
    
    <div class="panel" id="panel-stats">
        <div class="panel-header">
            <div class="panel-title">STATISTICS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="statsContent"></div>
    </div>
    
    <div class="panel" id="panel-prestige">
        <div class="panel-header">
            <div class="panel-title">PRESTIGE</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="prestigeContent"></div>
    </div>
    
    <div class="panel" id="panel-achievements">
        <div class="panel-header">
            <div class="panel-title">ACHIEVEMENTS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="achievementsContent"></div>
    </div>
    
    <div class="panel" id="panel-relics">
        <div class="panel-header">
            <div class="panel-title">RELICS</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="relicsContent"></div>
    </div>
    
    <div class="panel" id="panel-zones">
        <div class="panel-header">
            <div class="panel-title">ZONES</div>
            <button class="panel-close" onclick="closePanel()">×</button>
        </div>
        <div class="panel-content" id="zonesContent"></div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <div class="boss-arena" id="bossArena">
        <canvas id="bossCanvas"></canvas>
        <div class="boss-hud">
            <div id="bossName">BOSS</div>
            <div>HP: <span id="bossPlayerHp">3</span></div>
            <div id="bossTimer">60s</div>
        </div>
        <div class="boss-hp-bar"><div class="boss-hp-fill" id="bossHpFill"></div></div>
        <button class="boss-quit" onclick="quitBoss()">QUIT</button>
    </div>
    
    <div class="ability-bar" id="abilityBar"></div>
    
    <!-- Load all modules -->
    <script src="constants.js"></script>
    <script src="helpers.js"></script>
    <script src="audio.js"></script>
    <script src="save.js"></script>
    <script src="ui.js"></script>
    <script src="visual.js"></script>
    <script src="boss.js"></script>
    <script src="game.js"></script>
    
<script>
        // Wait for all scripts to load, then initialize
        function initGame() {
            if (!window.GAME || !window.UPGRADES) {
                setTimeout(initGame, 50);
                return;
            }
            
            // ========================
            // INITIALIZATION
            // ========================
            
            // Initialize Visual System (EPIC backgrounds!)
            if (typeof initVisuals === 'function') {
                initVisuals();
            }
            
            // Load game
            loadGame();
            applySettings();
            // initBG() - handled by visual.js now
            if (typeof initRelicShop === 'function') initRelicShop();
            calculateRelicBonuses();
            updateDisplay();
            renderAbilityBar();
            
            // Game loops
            setInterval(() => {
                if (typeof getCps === 'function' && window.GAME && !window.bossActive) {
                    const cps = getCps();
                    if (cps > 0) {
                        window.GAME.energy += cps / 10;
                        window.GAME.lifetimeEnergy += cps / 10;
                        updateDisplay();
                    }
                    if (typeof checkAchievements === 'function') checkAchievements();
                    if (typeof window.clickCombo === 'number' && window.clickCombo > 1) {
                        window.clickCombo -= 0.02;
                        if (window.clickCombo < 1) window.clickCombo = 1;
                        window.GAME.combo = window.clickCombo;
                    }
                }
            }, 100);
            
            setInterval(() => {
                if (typeof updateParticles === 'function') updateParticles();
                if (typeof applyScreenShake === 'function') applyScreenShake();
            }, 16);
            
            setInterval(() => {
                if (window.abilityCooldowns) {
                    Object.keys(window.abilityCooldowns).forEach(k => window.abilityCooldowns[k] = Math.max(0, window.abilityCooldowns[k] - 1));
                    if (typeof renderAbilityBar === 'function') renderAbilityBar();
                }
            }, 1000);
            
            setInterval(() => { if (typeof saveGame === 'function') saveGame(false); }, 30000);
            
            window.addEventListener('resize', () => {
                if (bgCanvas) {
                    bgCanvas.width = window.innerWidth;
                    bgCanvas.height = window.innerHeight;
                }
            });
        }
        
        // Start initialization
        initGame();
    </script>
</body>
</html>
