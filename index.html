<!DOCTYPE html>
<html lang="en">
<head>

    <title>Quantum Genesis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        .title { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #00ccff; text-shadow: 0 0 20px #00ccff55; letter-spacing: 3px; }
        .header-btns { display: flex; gap: 0.5rem; }
        .btn { background: rgba(0,200,255,0.1); border: 1px solid #00ccff44; color: #00ccff; padding: 0.4rem 0.8rem; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .btn:hover { background: rgba(0,200,255,0.2); box-shadow: 0 0 10px #00ccff33; }
        .menu { position: fixed; top: 4rem; left: 1rem; display: flex; flex-direction: column; gap: 0.4rem; z-index: 100; }
        .menu-btn { background: rgba(20,25,60,0.85); border: 1px solid #4466ff33; color: #aabbdd; padding: 0.6rem 1rem; cursor: pointer; font-family: inherit; font-size: 0.95rem; text-align: left; transition: all 0.2s; border-radius: 4px; }
        .menu-btn:hover, .menu-btn.active { background: rgba(60,80,180,0.5); border-color: #6688ff; color: #ccddff; }
        .menu-btn .key { display: inline-block; background: #334466; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.75rem; margin-right: 0.4rem; font-family: 'Orbitron', sans-serif; }
        .game-container { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .stats { display: flex; gap: 1.5rem; margin: 1rem 0; }
        .stat { text-align: center; }
        .stat .lbl { display: block; font-size: 0.7rem; color: #6688aa; letter-spacing: 1px; }
        .stat .val { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #aaccff; }
        .stat.crit .val { color: #ffaa00; }
        .energy-display { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #00ddff; text-shadow: 0 0 20px #00ddff66; margin: 0.5rem 0; }
        .boss-btn { background: linear-gradient(135deg,#ff3300,#aa0000); border: 2px solid #ff4400; color: #fff; padding: 0.8rem 2rem; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 1rem; margin-top: 1rem; transition: all 0.2s; }
        .boss-btn:hover { box-shadow: 0 0 20px #ff330066; transform: scale(1.05); }
        .panel { position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; background: rgba(10,15,35,0.98); border-left: 1px solid #334466; z-index: 200; transition: right 0.3s; overflow-y: auto; }
        .panel.active { right: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #334466; background: rgba(20,30,60,0.5); }
        .panel-title { font-family: 'Orbitron', sans-serif; color: #6688ff; }
        .panel-close { background: none; border: none; color: #8899aa; font-size: 1.5rem; cursor: pointer; }
        .panel-content { padding: 1rem; }
        .shop-tabs { display: flex; gap: 0.3rem; padding: 0.5rem; background: #1a1a2e; border-bottom: 1px solid #334466; }
        .shop-tab { flex: 1; padding: 0.4rem; background: #223344; border: 1px solid #334455; color: #88aacc; cursor: pointer; border-radius: 4px; }
        .shop-tab.active { background: #334466; color: #aaccff; }
        .upgrade-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 0.8rem; }
        .upgrade-card { background: rgba(30,40,80,0.6); border: 1px solid #4455aa33; padding: 0.8rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .upgrade-card:hover { border-color: #6688ff; background: rgba(50,70,150,0.5); }
        .upgrade-card.owned { border-color: #22aa66; }
        .upgrade-card.affordable { border-color: #ffaa00; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast-msg { background: rgba(20,30,60,0.95); border: 1px solid #4466ff; padding: 0.8rem 1.5rem; border-radius: 4px; animation: toastIn 0.3s ease-out; }
        .toast-msg.error { border-color: #ff4444; color: #ff6666; }
        .toast-msg.success { border-color: #44ff88; color: #66ffaa; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .boss-arena { position: fixed; inset: 0; background: rgba(5,5,15,0.97); z-index: 400; display: none; }
        .boss-arena.active { display: block; }
        #bossCanvas { width: 100%; height: 100%; }
        .boss-hud { position: fixed; top: 1rem; left: 1rem; right: 1rem; display: flex; justify-content: space-between; font-family: 'Orbitron', sans-serif; }
        .boss-hp-bar { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); width: 60%; height: 20px; background: #222; border: 2px solid #ff3300; border-radius: 10px; overflow: hidden; }
        .boss-hp-fill { height: 100%; background: linear-gradient(90deg,#ff3300,#ff6600); transition: width 0.3s; }
        .boss-quit { position: fixed; top: 1rem; right: 1rem; background: #ff3333; border: none; color: #fff; padding: 0.5rem 1rem; cursor: pointer; }
        .ability-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 0.5rem; padding: 0.5rem; background: rgba(10,15,30,0.95); border-top: 1px solid #334466; z-index: 100; }
        .ability-btn { width: 50px; height: 50px; background: rgba(30,40,80,0.8); border: 2px solid #4455aa; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.2s; }
        .ability-btn:hover { border-color: #6688ff; }
        .ability-btn.locked { opacity: 0.4; }
        .ability-btn.cooldown { opacity: 0.5; }
        .ability-btn .key { position: absolute; top: 2px; left: 4px; font-size: 0.6rem; color: #88aacc; }
        .ability-btn .cd-timer { position: absolute; bottom: 2px; font-size: 0.7rem; color: #ffaa00; }
        .ability-btn .icon { font-size: 1.2rem; }
    </style>
</head>

    // ========================
    // HELPER FUNCTIONS
    // ========================
    function formatNumber(n) {
        if (typeof n === 'string') n = parseFloat(n);
        const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx'];
        if (n < 1000) return Math.floor(n).toString();
        let si = 0;
        while (n >= 1000 && si < suffixes.length - 1) {
            n /= 1000;
            si++;
        }
        return n.toFixed(2) + suffixes[si];
    }
    
    function getUpgradeCost(id) {
        const up = UPGRADES.find(u => u.id === id);
        const level = GAME.upgrades[id] || 0;
        return Math.floor(up.base * Math.pow(up.scale, level));
    }
    
    function getClickPower() {
        let power = 1;
        UPGRADES.forEach(u => {
            if (u.id.startsWith('c')) {
                power += (u.effect || 0) * (GAME.upgrades[u.id] || 0);
            }
        });
        power *= specialEffects.idleMult;
        power *= GAME.combo;
        power *= getZoneMult();
        power *= (1 + (GAME.prestigeBonus || 0));
        return power;
    }
    
    function getCps() {
        let cps = 0;
        UPGRADES.forEach(u => {
            if (u.id.startsWith('g')) {
                cps += (u.effect || 0) * (GAME.upgrades[u.id] || 0);
            }
        });
        if (GAME.upgrades['ov1']) cps *= 1 + GAME.upgrades['ov1'];
        cps *= specialEffects.idleMult;
        cps *= getZoneMult();
        cps *= (1 + (GAME.prestigeBonus || 0));
        return cps;
    }
    
    function getCritChance() { return Math.min(0.5, 0.02 * (GAME.upgrades['cr1'] || 0)); }
    
    function getZoneMult() { return GAME.zones.find(z => z.id === GAME.currentZone)?.mult || 1; }
    
    function getBossDodge() { return (GAME.upgrades['b1'] || 0); }
    function getBossDamage() { return 20 + (GAME.upgrades['b2'] || 0) * 10; }
    function getBossLastStand() { return GAME.upgrades['b4'] > 0; }

    // ========================
    // SAVE/LOAD
    // ========================
    function saveGame(showToast) {
        let now = Date.now();
        if (!saveGame.lastSave || now - saveGame.lastSave > 2000) {
            GAME.lastLogin = now;
            localStorage.setItem('quantumGenesis', JSON.stringify(GAME));
            if (showToast !== false) toast('Game saved!');
            saveGame.lastSave = now;
        }
    }
    saveGame.lastSave = 0;
    
    function loadGame() {
        const saved = localStorage.getItem('quantumGenesis');
        if (saved) {
            const data = JSON.parse(saved);
            if (data.prestigeBonus === undefined) {
                data.prestigeBonus = (data.prestigeRank + 1) * 0.5;
            }
            if (data.lastLogin === undefined) data.lastLogin = Date.now();
            Object.assign(GAME, data);
            
            if (data.lastLogin) {
                const offlineMs = Date.now() - data.lastLogin;
                const offlineSeconds = Math.min(offlineMs / 1000, 3600 * 8);
                const cps = getCps();
                if (cps > 0 && offlineSeconds > 10) {
                    const offlineEnergy = cps * offlineSeconds;
                    GAME.energy += offlineEnergy;
                    GAME.lifetimeEnergy += offlineEnergy;
                    if (offlineEnergy > 100) {
                        toast('Welcome back! +' + formatNumber(offlineEnergy) + ' offline energy', 'success');
                    }
                }
            }
        }
    }
    
    function resetGame() {
        if (confirm('Reset all progress?')) {
            localStorage.removeItem('quantumGenesis');
            location.reload();
        }
    }

        initAudio();

        let power = getClickPower();
        if (isCrit) { power *= (2 + (GAME.upgrades['cr2'] || 0) * 0.5); playCrit(); }
        else { playClick(); }
        GAME.energy += power;
        GAME.lifetimeEnergy += power;
        GAME.clicks++;
        clickCombo = Math.min(10, clickCombo + 0.1);
        GAME.combo = clickCombo;
        if (clickCombo > GAME.maxCombo) GAME.maxCombo = clickCombo;
        
        // Spawn particles
        const centerX = GAME.planetX || window.innerWidth / 2;
        const centerY = (GAME.planetY || window.innerHeight / 2) - GAME.planetRadius - 20;
        showClickText(power, isCrit);
        updateDisplay();
        
        // Check achievements
        checkAchievements();
    }

    function renderShopTab(tab) {
        const content = document.getElementById('shopContent');
        content.innerHTML = '';
        
        const toggle = document.createElement('div');
        toggle.style.cssText = 'display:flex;gap:0.5rem;margin-bottom:1rem;align-items:center;';
        toggle.innerHTML = '<span style="color:#88aacc;font-size:0.85rem;">Buy:</span>' +

            'style="min-width:50px;background:#334466;color:#aaccff;padding:0.3rem 0.5rem;cursor:pointer;border:1px solid #4466aa;border-radius:3px;font-size:0.85rem;">' +
            (buyMulti === 999 ? 'MAX' : buyMulti) + '</button>' +
            '<button onclick="buyMulti=1" style="background:#222;color:#888;padding:0.2rem 0.4rem;cursor:pointer;border:1px solid #444;border-radius:3px;">Clear</button>';
        content.appendChild(toggle);
        
        let filter;
        if (tab === 'click') filter = u => u.id.startsWith('c') || u.id.startsWith('cr') || u.id.startsWith('cm') || u.id.startsWith('mc');
        else if (tab === 'gen') filter = u => u.id.startsWith('g');
        else if (tab === 'combat') filter = u => u.id.startsWith('b');
        else if (tab === 'special') filter = u => u.id.startsWith('ov') || u.id.startsWith('id') || u.id.startsWith('ch') || u.id.startsWith('bh') || u.id.startsWith('ss');
        else if (tab === 'abilities') { renderAbilitiesShop(content); return; }
        
        const grid = document.createElement('div');
        grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.5rem;';
        
        const filtered = UPGRADES.filter(filter).sort((a, b) => a.base - b.base);
        
        filtered.forEach(u => {
            const level = GAME.upgrades[u.id] || 0;
            const cost = getUpgradeCost(u.id);
            const maxed = level >= u.max;
            const canAfford = GAME.energy >= cost;
            
            let cardBg, cardBorder;
            if (maxed) cardBg = '#223344', cardBorder = '#44ff88';
            else if (level > 0) cardBg = '#223344', cardBorder = '#4488aa';
            else if (canAfford) cardBg = '#224433', cardBorder = '#44ff88';
            else cardBg = '#1a1a22', cardBorder = '#333344';
            
            const card = document.createElement('div');
            card.style.cssText = 'background:' + cardBg + ';padding:0.5rem;border-radius:4px;cursor:' + (canAfford && !maxed ? 'pointer' : 'default') + ';border:2px solid ' + cardBorder + ';';
            
            const levelText = maxed ? 'MAX' : 'Lv' + level;
            const levelColor = maxed ? '#44ff88' : (level > 0 ? '#44aaff' : '#668899');
            const costText = maxed ? 'MAXED' : formatNumber(cost);
            const costColor = maxed ? '#44ff88' : (canAfford ? '#44ff88' : '#aa8866');
            
            card.innerHTML = '<div style="color:#aabbcc;font-size:0.85rem;font-weight:bold;">' + u.name + '</div>' +
                '<div style="color:' + levelColor + ';font-size:0.8rem;">' + levelText + '</div>' +
                '<div style="color:#558877;font-size:0.7rem;">' + u.desc + '</div>' +
                '<div style="color:' + costColor + ';font-size:0.8rem;margin-top:3px;">' + costText + '</div>';
            
            if (canAfford && !maxed) {
                card.onclick = () => {
                    let toBuy = Math.min(buyMulti === 999 ? u.max - level : buyMulti, u.max - level);
                    let totalCost = 0;
                    for (let i = 0; i < toBuy; i++) totalCost += Math.floor(u.base * Math.pow(u.scale, level + i));
                    if (GAME.energy >= totalCost) {
                        GAME.energy -= totalCost;
                        GAME.upgrades[u.id] = level + toBuy;
                        playUpgrade();
                        saveGame(false);
                        updateDisplay();
                        switchShopTab(tab);
                    } else { playError(); toast('Not enough energy', 'error'); }
                };
            }
            grid.appendChild(card);
        });
        content.appendChild(grid);
    }

    // ========================
    // BOSS FIGHT
    // ========================
    let bossActive = false, bossCanvas, bossCtx, bossIndex = 0, bossCurrent, bossHp, bossMaxHp, bossTime, playerHp = 3;
    let bossProjectiles = [], bossMinions = [], bossClones = [], bossLasers = [];
    let keys = {space: false, left: false, right: false, up: false, down: false};
    let playerX = 0, playerY = 0, canvasW = 0, canvasH = 0;
    let spaceUsed = false;
    
    function startBoss() {
        initAudio();
        playBossStart();
        bossActive = true;
        document.getElementById('bossArena').classList.add('active');
        bossCanvas = document.getElementById('bossCanvas');
        bossCtx = bossCanvas.getContext('2d');
        canvasW = window.innerWidth;
        canvasH = window.innerHeight;
        bossCanvas.width = canvasW;
        bossCanvas.height = canvasH;
        bossIndex = Math.min(GAME.bossesWon, BOSSES.length - 1);
        bossCurrent = BOSSES[bossIndex];
        bossMaxHp = bossCurrent.hp;
        bossHp = bossMaxHp;
        bossTime = 60 + bossIndex * 15;
        playerHp = 3 + getBossDodge();
        
        bossProjectiles = [];
        bossMinions = [];
        bossClones = [];
        bossLasers = [];
        
        playerX = canvasW / 2;
        playerY = canvasH - 100;
        
        document.getElementById('bossName').textContent = bossCurrent.name;
        document.getElementById('bossPlayerHp').textContent = playerHp;
        
        document.addEventListener('keydown', keydown);
        document.addEventListener('keyup', keyup);
        
        bossLoop();
    }
    
    function quitBoss() {
        bossActive = false;
        document.getElementById('bossArena').classList.remove('active');
        document.removeEventListener('keydown', keydown);
        document.removeEventListener('keyup', keyup);
    }
    
    function keydown(e) {
        if (e.code === 'Space' && !spaceUsed) { keys.space = true; spaceUsed = true; e.preventDefault(); }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
    }
    
    function keyup(e) {
        if (e.code === 'Space') { keys.space = false; spaceUsed = false; }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    }
    
    function bossLoop() {
        if (!bossActive) return;
        
        const dt = 1/60;
        bossTime -= dt;
        document.getElementById('bossTimer').textContent = Math.ceil(bossTime) + 's';
        
        const hpPercent = bossHp / bossMaxHp;
        document.getElementById('bossHpFill').style.width = (hpPercent * 100) + '%';
        document.getElementById('bossPlayerHp').textContent = playerHp;
        
        bossCtx.fillStyle = '#0a0a14';
        bossCtx.fillRect(0, 0, canvasW, canvasH);
        
        // Draw boss
        const bossX = canvasW / 2;
        const bossY = 150;
        
        if (bossHp > bossMaxHp * 0.5 || bossClones.length === 0) {
            bossCtx.beginPath();
            bossCtx.arc(bossX, bossY, 60, 0, Math.PI * 2);
            bossCtx.fillStyle = bossCurrent.color;
            bossCtx.fill();
            bossCtx.strokeStyle = '#fff';
            bossCtx.lineWidth = 3;
            bossCtx.stroke();
        }
        
        // Split at 50%
        if (hpPercent <= 0.5 && bossClones.length === 0) {
            for (let i = 0; i < 2; i++) {
                bossClones.push({x: bossX + (i === 0 ? -80 : 80), y: bossY, vx: (i === 0 ? -2 : 2)});
            }
        }
        
        // Update and draw clones
        bossClones.forEach(clone => {
            clone.x += clone.vx;
            if (clone.x < 50 || clone.x > canvasW - 50) clone.vx *= -1;
            bossCtx.beginPath();
            bossCtx.arc(clone.x, clone.y, 40, 0, Math.PI * 2);
            bossCtx.fillStyle = bossCurrent.color;
            bossCtx.fill();
        });
        
        // Player movement
        const speed = 8;
        if (keys.left) playerX -= speed;
        if (keys.right) playerX += speed;
        if (keys.up) playerY -= speed;
        if (keys.down) playerY += speed;
        playerX = Math.max(20, Math.min(canvasW - 20, playerX));
        playerY = Math.max(20, Math.min(canvasH - 20, playerY));
        
        // Draw player
        bossCtx.beginPath();
        bossCtx.arc(playerX, playerY, 15, 0, Math.PI * 2);
        bossCtx.fillStyle = '#00ff00';
        bossCtx.fill();
        
        // Attack
        if (keys.space) {
            keys.space = false;
            const damage = getBossDamage();
            bossClones.forEach(clone => {
                const dx = clone.x - playerX;
                const dy = clone.y - playerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 100) {
                    bossHp -= damage;
                    playBossHit();
                }
            });
            
            const dx = bossX - playerX;
            const dy = bossY - playerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 100) {
                bossHp -= damage;
                playBossHit();
            }
        }
        
        // Win/lose
        if (bossTime <= 0 || playerHp <= 0) {
            quitBoss();
            if (playerHp <= 0) toast('DEFEATED!', 'error');
            else toast(' Time up!', 'error');
            return;
        }
        
        if (bossHp <= 0) {
            GAME.bossesWon++;
            playBossWin();
            toast('BOSS DEFEATED!', 'success');
            quitBoss();
            return;
        }
        
        requestAnimationFrame(bossLoop);
    }

    // ========================
    // SOUND SYSTEM
    // ========================
    let audioCtx = null;
    let soundEnabled = true;
    
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('soundBtn').textContent = soundEnabled ? 'Sound' : 'Muted';
    }
    
    function playSound(type, duration, freq, freqEnd, volume) {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
    
    function playClick() { playSound('sine', 0.08, 600, 800, 0.1); }
    function playCrit() { playSound('square', 0.15, 880, 1200, 0.12); playSound('sine', 0.2, 440, 220, 0.15); }
    function playUpgrade() { playSound('triangle', 0.12, 523, 784, 0.1); }
    function playError() { playSound('sawtooth', 0.3, 200, 100, 0.1); }
    function playToast() { playSound('sine', 0.15, 400, 600, 0.08); }
    function playPrestige() { playSound('sawtooth', 0.5, 100, 800, 0.15); setTimeout(() => playSound('sawtooth', 0.5, 200, 1000, 0.15), 200); setTimeout(() => playSound('sine', 1, 300, 1500, 0.2), 400); }
    function playBossStart() { playSound('square', 0.3, 200, 400, 0.15); setTimeout(() => playSound('square', 0.3, 300, 500, 0.15), 150); setTimeout(() => playSound('square', 0.4, 400, 600, 0.15), 300); }
    function playBossHit() { playSound('sawtooth', 0.1, 150, 100, 0.15); }
    function playBossWin() { playSound('sine', 0.5, 523, 1047, 0.2); }
    function playPanelSwitch() { playSound('sine', 0.04, 400, 500, 0.04); }
    function playMenuOpen() { playSound('triangle', 0.08, 300, 500, 0.06); }
    function playMenuClose() { playSound('triangle', 0.08, 500, 300, 0.06); }
    function playAbility() { playSound('square', 0.1, 330, 660, 0.1); }
    
    // ========================
    // BACKGROUND SYSTEM
    // ========================
    let bgCanvas, bgCtx, bgStars = [], bgPlanets = [], bgNebulas = [], shootingStars = [], blackHoles = [], comets = [];
    let quantumParticles = [], energyStrands = [], auras = [], wormholes = [];
    let bgStarsInitialized = false;
    let screenShake = 0;
    let clickParticles = [];
    let shockwaves = [];
    
    function initBG() {
        bgCanvas = document.getElementById('bgCanvas');
        bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        
        for (let i = 0; i < 300; i++) {
            bgStars.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                z: Math.random() * 3 + 0.5,
                color: Math.random() > 0.8 ? '#ff6688' : (Math.random() > 0.5 ? '#6688ff' : '#ffffff'),
                twinkle: Math.random() * Math.PI * 2
            });
        }
        
        for (let i = 0; i < 6; i++) {
            bgPlanets.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                r: 10 + Math.random() * 30,
                color: `hsl(${Math.random() * 360}, 50%, 40%)`
            });
        }
        
        for (let i = 0; i < 5; i++) {
            bgNebulas.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                r: 100 + Math.random() * 150,
                hue: Math.random() * 60 + 200
            });
        }
        
        if (!bgStarsInitialized) {
            bgStarsInitialized = true;
            
            for (let i = 0; i < 100; i++) {
                quantumParticles.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: 1 + Math.random() * 2,
                    alpha: 0.3 + Math.random() * 0.7,
                    hue: Math.random() > 0.5 ? 180 : 280
                });
            }
            
            for (let i = 0; i < 3; i++) {
                auras.push({
                    radius: 100 + i * 40,
                    speed: 0.001 + Math.random() * 0.002,
                    offset: Math.random() * Math.PI * 2,
                    hue: 180 + i * 40,
                    alpha: 0.15 - i * 0.03
                });
            }
        }
        
        drawBG();
    }
    
    function initBlackHoles() {
        const bhCount = GAME.upgrades.bh1 || 0;
        if (window.innerWidth > 0 && window.innerHeight > 0) {
            blackHoles = [];
            for (let i = 0; i < bhCount; i++) {
                blackHoles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight * 0.6,
                    radius: 20 + Math.random() * 30,
                    rotation: Math.random() * Math.PI * 2,
                    speed: 0.001 + Math.random() * 0.002,
                    wobble: Math.random() * 100
                });
            }
        }
    }
    
    function initShootingStars() {
        const ssCount = GAME.upgrades.ss1 || 0;
        if (ssCount > shootingStars.length && window.innerWidth > 0 && window.innerHeight > 0) {
            for (let i = shootingStars.length; i < ssCount; i++) {
                shootingStars.push({
                    x: Math.random() * window.innerWidth,
                    y: -100,
                    speed: 3 + Math.random() * 5,
                    length: 50 + Math.random() * 100,
                    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
                    timer: Math.random() * 30000
                });
            }
        }
    }
    
    function initComets() {
        const cometCount = GAME.upgrades.cm1 || 0;
        if (cometCount > comets.length && window.innerWidth > 0) {
            for (let i = comets.length; i < cometCount; i++) {
                comets.push({
                    angle: Math.random() * Math.PI * 2,
                    dist: window.innerWidth * (0.5 + Math.random() * 0.5),
                    speed: 0.0002 + Math.random() * 0.0003,
                    size: 3 + Math.random() * 5
                });
            }
        }
    }
    
    function drawBG() {
        const W = bgCanvas.width;
        const H = bgCanvas.height;
        
        bgCtx.setTransform(1, 0, 0, 1, 0, 0);
        
        // Screen shake
        if (screenShake > 0) {
            bgCtx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.9;
            if (screenShake < 0.1) screenShake = 0;
        }
        
        const tier = GAME.planetTier || 0;
        const baseColors = ['#020208', '#040410', '#080818', '#0c1020', '#101528', '#181840', '#202050'];
        bgCtx.fillStyle = baseColors[Math.min(tier, baseColors.length - 1)];
        bgCtx.fillRect(0, 0, W, H);
        
        // Stars
        bgStars.forEach(s => {
            const tw = Math.sin(Date.now() * 0.003 + s.twinkle) * 0.5 + 0.5;
            bgCtx.globalAlpha = 0.5 + tw * 0.5;
            bgCtx.fillStyle = s.color;
            bgCtx.beginPath();
            bgCtx.arc(s.x, s.y, s.z * 2, 0, Math.PI * 2);
            bgCtx.fill();
        });
        bgCtx.globalAlpha = 1;
        
        // Planets
        bgPlanets.forEach(p => {
            const grad = bgCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            grad.addColorStop(0, p.color);
            grad.addColorStop(1, 'transparent');
            bgCtx.fillStyle = grad;
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            bgCtx.fill();
        });
        
        // Nebulas
        bgNebulas.forEach(n => {
            const grad = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            grad.addColorStop(0, `hsla(${n.hue}, 80%, 30%, 0.2)`);
            grad.addColorStop(1, 'transparent');
            bgCtx.fillStyle = grad;
            bgCtx.beginPath();
            bgCtx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            bgCtx.fill();
        });
        
        // Shooting stars
        shootingStars.forEach(ss => {
            ss.timer -= 16;
            if (ss.timer > 0) return;
            
            if (!isFinite(ss.x) || !isFinite(ss.y) || !isFinite(ss.length)) return;
            
            const tailX = ss.x - Math.cos(ss.angle) * ss.length;
            const tailY = ss.y - Math.sin(ss.angle) * ss.length;
            
            try {
                const ssGrad = bgCtx.createLinearGradient(ss.x, ss.y, tailX, tailY);
                ssGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                ssGrad.addColorStop(0.3, 'rgba(200, 220, 255, 0.5)');
                ssGrad.addColorStop(1, 'transparent');
                
                bgCtx.strokeStyle = ssGrad;
                bgCtx.lineWidth = 2;
                bgCtx.lineCap = 'round';
                bgCtx.beginPath();
                bgCtx.moveTo(tailX, tailY);
                bgCtx.lineTo(ss.x, ss.y);
                bgCtx.stroke();
            } catch(e) {}
            
            ss.x += Math.cos(ss.angle) * ss.speed;
            ss.y += Math.sin(ss.angle) * ss.speed;
            
            if (ss.y > H + 100 || ss.x > W + 100) {
                ss.x = -50;
                ss.y = Math.random() * H * 0.3;
                ss.timer = 10000 + Math.random() * 20000;
            }
        });
        
        // Black holes
        blackHoles.forEach(bh => {
            const wobbleX = Math.sin(Date.now() * bh.speed + bh.wobble) * 10;
            const wobbleY = Math.cos(Date.now() * bh.speed * 0.7 + bh.wobble) * 8;
            const x = bh.x + wobbleX;
            const y = bh.y + wobbleY;
            bh.rotation += bh.speed;
            
            const bhGrad = bgCtx.createRadialGradient(x, y, 0, x, y, bh.radius);
            bhGrad.addColorStop(0, '#000000');
            bhGrad.addColorStop(0.3, '#000011');
            bhGrad.addColorStop(0.5, '#000022');
            bhGrad.addColorStop(0.7, '#000044');
            bhGrad.addColorStop(1, 'transparent');
            bgCtx.fillStyle = bhGrad;
            bgCtx.beginPath();
            bgCtx.arc(x, y, bh.radius, 0, Math.PI * 2);
            bgCtx.fill();
            
            // Accretion disk
            for (let d = 0; d < 3; d++) {
                const diskAngle = bh.rotation + (d * Math.PI * 2 / 3);
                const diskDist = bh.radius * 1.3;
                const diskX = x + Math.cos(diskAngle) * diskDist;
                const diskY = y + Math.sin(diskAngle) * diskDist * 0.6;
                
                bgCtx.fillStyle = '#ff6600';
                bgCtx.beginPath();
                bgCtx.arc(diskX, diskY, 3, 0, Math.PI * 2);
                bgCtx.fill();
            }
        });
        
        // Comets
        comets.forEach(c => {
            c.angle += c.speed;
            const cx = W / 2 + Math.cos(c.angle) * c.dist;
            const cy = H / 2 + Math.sin(c.angle) * c.dist * 0.4;
            
            const tailAngle = c.angle + Math.PI;
            const tailLength = 30 + c.size * 3;
            const tailX = cx + Math.cos(tailAngle) * tailLength;
            const tailY = cy + Math.sin(tailAngle) * tailLength;
            
            const cGrad = bgCtx.createLinearGradient(cx, cy, tailX, tailY);
            cGrad.addColorStop(0, 'rgba(150, 200, 255, 0.8)');
            cGrad.addColorStop(1, 'transparent');
            
            bgCtx.strokeStyle = cGrad;
            bgCtx.lineWidth = c.size;
            bgCtx.lineCap = 'round';
            bgCtx.beginPath();
            bgCtx.moveTo(tailX, tailY);
            bgCtx.lineTo(cx, cy);
            bgCtx.stroke();
        });
        
        // Quantum particles
        const planetTier = GAME.planetTier || 0;
        if (planetTier >= 2) {
            quantumParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                
                if (p.x < 0) p.x = W;
                if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H;
                if (p.y > H) p.y = 0;
                
                const glow = bgCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
                glow.addColorStop(0, `hsla(${p.hue}, 100%, 70%, ${p.alpha})`);
                glow.addColorStop(1, 'transparent');
                bgCtx.fillStyle = glow;
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
                bgCtx.fill();
            });
        }
        
        // Planet
        const planetX = W / 2;
        const planetY = H / 2 + 50;
        GAME.planetX = planetX;
        GAME.planetY = planetY;
        
        const planetProgress = Math.min(10, Math.floor(GAME.lifetimeEnergy / 10000));
        const planetRadius = 80 + planetProgress * 5;
        GAME.planetRadius = planetRadius;
        
        // Planet glow
        const atmAlpha = Math.min(0.6, 0.2 + planetProgress * 0.04);
        const atmGrad = bgCtx.createRadialGradient(planetX, planetY, planetRadius * 0.8, planetX, planetY, planetRadius + 40);
        atmGrad.addColorStop(0, 'transparent');
        atmGrad.addColorStop(0.5, `rgba(100, 180, 255, ${atmAlpha})`);
        atmGrad.addColorStop(1, 'transparent');
        bgCtx.fillStyle = atmGrad;
        bgCtx.beginPath();
        bgCtx.arc(planetX, planetY, planetRadius + 40, 0, Math.PI * 2);
        bgCtx.fill();
        
        // Planet body
        const pcolors = [
            ['#6b5344', '#3d2f22'],
            ['#567856', '#345634'],
            ['#4a6a8a', '#2a426a'],
            ['#5a5a8a', '#3a3a6a'],
            ['#6a4a8a', '#4a2a6a'],
            ['#8a4a8a', '#6a2a6a'],
            ['#aa4aaa', '#882a88'],
            ['#cc44cc', '#aa22aa'],
            ['#ee66ee', '#cc44cc'],
            ['#ffffff', '#aaaaff']
        ];
        const [pcLight, pcDark] = pcolors[Math.min(planetProgress, pcolors.length - 1)];
        
        const planetGrad = bgCtx.createRadialGradient(planetX - planetRadius * 0.3, planetY - planetRadius * 0.3, 0, planetX, planetY, planetRadius);
        planetGrad.addColorStop(0, pcLight);
        planetGrad.addColorStop(0.5, pcDark);
        planetGrad.addColorStop(1, '#111122');
        
        bgCtx.fillStyle = planetGrad;
        bgCtx.beginPath();
        bgCtx.arc(planetX, planetY, planetRadius, 0, Math.PI * 2);
        bgCtx.fill();
        
        // Energy core
        if (getCps() > 0 || planetProgress >= 2) {
            const coreIntensity = Math.min(1, 0.3 + planetProgress * 0.07 + getCps() / 100000);
            const coreGrad = bgCtx.createRadialGradient(planetX, planetY, 0, planetX, planetY, planetRadius * 0.4);
            coreGrad.addColorStop(0, `rgba(200, 150, 255, ${coreIntensity})`);
            coreGrad.addColorStop(0.5, `rgba(100, 50, 200, ${coreIntensity * 0.5})`);
            coreGrad.addColorStop(1, 'transparent');
            bgCtx.fillStyle = coreGrad;
            bgCtx.beginPath();
            bgCtx.arc(planetX, planetY, planetRadius * 0.4, 0, Math.PI * 2);
            bgCtx.fill();
            
            const pulse = Math.sin(Date.now() * 0.005) * 0.1 + 0.9;
            bgCtx.strokeStyle = `rgba(150, 100, 255, ${coreIntensity * pulse})`;
            bgCtx.lineWidth = 2;
            bgCtx.beginPath();
            bgCtx.arc(planetX, planetY, planetRadius * 0.35, 0, Math.PI * 2);
            bgCtx.stroke();
        }
        
        // Auras for planet
        if (planetProgress >= 3) {
            auras.forEach((a, i) => {
                const time = Date.now() * a.speed + a.offset;
                const radius = a.radius + Math.sin(time) * 20;
                
                const gradient = bgCtx.createRadialGradient(planetX, planetY, planetRadius, planetX, planetY, radius);
                gradient.addColorStop(0, `hsla(${a.hue}, 100%, 50%, 0)`);
                gradient.addColorStop(0.5, `hsla(${a.hue}, 100%, 60%, ${a.alpha})`);
                gradient.addColorStop(1, `hsla(${a.hue}, 100%, 50%, 0)`);
                
                bgCtx.fillStyle = gradient;
                bgCtx.beginPath();
                bgCtx.arc(planetX, planetY, radius, 0, Math.PI * 2);
                bgCtx.fill();
            });
        }
        
        // Particles
        clickParticles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.life -= 0.03;
            
            if (p.life <= 0) {
                clickParticles.splice(i, 1);
                return;
            }
            
            const el = document.getElementById('particle-' + p.id);
            if (el) {
                el.style.left = p.x + 'px';
                el.style.top = p.y + 'px';
                el.style.opacity = p.life;
            }
        });
        
        requestAnimationFrame(drawBG);
    }
    
    // ========================
    // ACHIEVEMENTS CHECK
    // ========================
    function checkAchievements() {
        if (!GAME.achievements) GAME.achievements = [];
        
        for (let a of ACHIEVEMENTS) {
            if (GAME.achievements.includes(a.id)) continue;
            
            let achieved = false;
            if (a.type === 'clicks') achieved = GAME.clicks >= a.val;
            else if (a.type === 'energy') achieved = GAME.lifetimeEnergy >= a.val;
            else if (a.type === 'bosses') achieved = GAME.bossesWon >= a.val;
            else if (a.type === 'prestige') achieved = GAME.prestigeRank >= a.val;
            else if (a.type === 'upgrades') achieved = Object.values(GAME.upgrades || {}).reduce((x, y) => x + y, 0) >= a.val;
            else if (a.type === 'combo') achieved = GAME.maxCombo >= a.val;
            else if (a.type === 'cps') achieved = getCps() >= a.val;
            
            if (achieved) {
                GAME.achievements.push(a.id);
                playToast();
                toast('🏆 Achievement: ' + a.name, 'success');
                saveGame(false);
            }
        }
    }
    
    // ========================
    // GAME LOOPS
    // ========================
    setInterval(() => {
        if (!bossActive && getCps() > 0) {
            GAME.energy += getCps() / 10;
            GAME.lifetimeEnergy += getCps() / 10;
            updateDisplay();
        }
        checkAchievements();
        
        if (clickCombo > 1) {
            clickCombo -= 0.02;
            if (clickCombo < 1) clickCombo = 1;
            GAME.combo = clickCombo;
        }
    }, 100);
    
    setInterval(() => {
        Object.keys(abilityCooldowns).forEach(k => abilityCooldowns[k] = Math.max(0, abilityCooldowns[k] - 1));
        renderAbilityBar();
    }, 1000);
    
    setInterval(saveGame, 30000);
    
    // ========================
    // KEYBOARD SHORTCUTS
    // ========================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'u' || e.key === 'U') openShop();
        if (e.key === 's' || e.key === 'S') openPanel('stats');
        if (e.key === 'p' || e.key === 'P') openPanel('prestige');
        if (e.key === 'm' || e.key === 'M') openPanel('achievements');
        if (e.key === 'b' || e.key === 'B') startBoss();
    });
    
    // ========================
    // INITIALIZE
    // ========================
    try {
        loadGame();
        
        // Apply saved settings
        soundEnabled = GAME.soundEnabled;
        document.getElementById('soundBtn').textContent = soundEnabled ? 'Sound' : 'Muted';
        
        initBG();
        initBlackHoles();
        initShootingStars();
        initComets();
        updateDisplay();
        renderAbilityBar();
    } catch(e) {
        console.error('Init error:', e);
    }
    </script>
</body>
